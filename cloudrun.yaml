apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dintel-inference
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 30
      containers:
        - image: gcr.io/PROJECT_ID/dintel-inference:1.0.0
          ports: [{ containerPort: 8080 }]
          resources: { limits: { cpu: "2", memory: "1Gi" } }
          env:
            - { name: LOG_RAW_TEXT, value: "false" }
            - { name: MAX_JSON_BYTES, value: "262144" }
            - { name: MAX_IMAGE_BYTES, value: "5242880" }
            - { name: REQUEST_TIMEOUT_MS, value: "15000" }
            - { name: CORS_ORIGIN, value: "https://janrakshak.example.org" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: dintel-database-url, key: latest } }
            - name: DINTEL_API_KEY
              valueFrom: { secretKeyRef: { name: dintel-api-key, key: latest } }
          startupProbe: { httpGet: { path: /api/health, port: 8080 }, periodSeconds: 5, failureThreshold: 12 }
          livenessProbe: { httpGet: { path: /api/health, port: 8080 }, periodSeconds: 30 }
