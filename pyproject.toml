[project]
name = "dintel"
version = "1.0.0"
description = "D-Intel — Disaster Intelligence Engine (multi-task disaster report intelligence, JanRakshak-ready)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
[project.optional-dependencies]
deep = ["torch>=2.2", "transformers>=4.40", "timm>=0.9"]
[tool.setuptools.packages.find]
where = ["ml"]
